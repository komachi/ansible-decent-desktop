[tool.poetry]
name = "ansible-decent-desktop"
version = "0.1.0"
description = ""
authors = ["Anton Nesterov <anton@nesterov.cc>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
ansible = "^11.13.0"
debops = "^3.3.0"
jmespath = "^1.0.1"
lxml = "^5.3.0"
molecule-plugins = { extras = ["vagrant"], version = "^25.8.12" }
redis = "^8.1.0"

[tool.poetry.group.dev.dependencies]
molecule = "^26.3.0"
yamllint = "^1.35.1"
ansible-lint = { version = "^26.3.0", markers = "platform_system != 'Windows'" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
