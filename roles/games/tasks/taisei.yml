---
- name: Install Taisei Project
  ansible.builtin.apt:
    name: taisei
    state: present

- name: Ensures ~/.local/share/taisei exists
  ansible.builtin.file:
    path: /home/{{ username }}/.local/share/taisei
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0755"

- name: Copy Taisei Project config
  ansible.builtin.copy:
    src: taisei/config
    dest: /home/{{ username }}/.local/share/taisei/config
    mode: "0640"
    owner: "{{ username }}"
    group: "{{ username }}"
