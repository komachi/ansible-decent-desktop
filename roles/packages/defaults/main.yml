thunderbird_profiles:
  - name: default
    prefs:
      - pref: network.trr.mode
        value: "0"
      - pref: network.proxy.type
        value: "1"
      - pref: network.proxy.socks
        value: '"127.0.0.1"'
      - pref: network.proxy.socks_port
        value: "9050"
      - pref: network.proxy.socks_version
        value: "5"
      - pref: network.proxy.no_proxies_on
        value: '""'
      - pref: network.dns.disableIPv6
        value: "false"
      - pref: network.http.altsvc.enabled
        value: "true"
      - pref: network.http.altsvc.oe
        value: "true"
      - pref: general.warnOnAboutConfig
        value: "false"
      - pref: network.http.http3.enabled
        value: "true"
      - pref: ui.systemUsesDarkTheme
        value: "1"
      - pref: javascript.enabled
        value: "true"

firefox_default_prefs:
  - pref: security.OCSP.require
    value: "false"
  - pref: security.OCSP.enabled
    value: "0"
  - pref: privacy.resistFingerprinting.letterboxing
    value: "false"
  - pref: network.dns.disableIPv6
    value: "false"
  - pref: network.http.altsvc.enabled
    value: "true"
  - pref: network.http.altsvc.oe
    value: "true"
  - pref: dom.serviceWorkers.enabled
    value: "true"
  - pref: javascript.options.wasm
    value: "true"
  - pref: keyword.enabled
    value: "true"
  - pref: identity.fxaccounts.enabled
    value: "false"
  - pref: general.warnOnAboutConfig
    value: "false"
  - pref: browser.backspace_action
    value: "2"
