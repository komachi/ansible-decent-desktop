  - [Application, GUI\Notifications\TorrentAdded, "false"]
  - [BitTorrent, Session\AlternativeGlobalDLSpeedLimit, 1000]
  - [BitTorrent, Session\AlternativeGlobalUPSpeedLimit, 1000]
  - [BitTorrent, Session\AnonymousModeEnabled, "true"]
  - [BitTorrent, Session\MaxConnections, 1000]
  - [BitTorrent, Session\MaxConnectionsPerTorrent, 200]
  - [BitTorrent, Session\MaxUploads, 50]
  - [BitTorrent, Session\MaxUploadsPerTorrent, 10]
  - [BitTorrent, Session\I2P\Enabled, "true"]
  - [BitTorrent, Session\I2P\MixedMode, "true"]
  - [
      BitTorrent,
      Session\AdditionalTrackersURL,
      "https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_best.txt",
    ]
  - [GUI, DownloadTrackerFavicon, "false"]
  - [GUI, Log\Enabled, "false"]
  - [GUI, Notifications\Enabled, "false"]
  - [LegalNotice, Accepted, "true"]
  - [Preferences, Advanced\useSystemIconTheme, "true"]
  - [Preferences, General\MinimizeToTray, "false"]
  - [Preferences, General\NoSplashScreen, "true"]
  - [Preferences, General\PreventFromSuspendWhenDownloading, "true"]
  - [Preferences, General\PreventFromSuspendWhenSeeding, "false"]
  - [Preferences, General\StartMinimized, "false"]
  - [Preferences, General\SystrayEnabled, "false"]
  - [Network, Proxy\Type, "None"]
  - [Preferences, Advanced\useSystemIconTheme, "true"]
  - [Preferences, General\NoSplashScreen, "true"]
