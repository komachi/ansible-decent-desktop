    value: "2"
  - pref: browser.urlbar.decodeURLsOnCop
    value: "true"
  - pref: mousewheel.horizscroll.withnokey.action
    value: "0"
  - pref: gfx.font_rendering.opentype_svg.enabled
    value: "true"
  - pref: gfx.downloadable_fonts.woff2.enabled
    value: "true"
  - pref: gfx.font_rendering.graphite.enabled
    value: "true"
  - pref: browser.display.use_document_fonts
    value: "1"
  - pref: browser.cache.disk.enable
    value: "true"
  - pref: browser.cache.memory.enable
    value: "true"
  - pref: browser.cache.memory.capacity
    value: "-1"
  - pref: extensions.pocket.enabled
    value: "false"
  - pref: dom.security.https_only_mode
    value: "true"
  - pref: network.http.http3.enabled
    value: "true"
  - pref: ui.systemUsesDarkTheme
    value: "1"
  - pref: pdfjs.viewerCssTheme
    value: "2"
