---
- name: Install electrum
  ansible.builtin.apt:
    name:
      - electrum
      - python3-qdarkstyle
      - python3-btchip
      - python3-trezor
      - python3-zbar
    state: present

- name: Ensures ~/.electrum exists
  ansible.builtin.file:
    path: /home/{{ username }}/.electrum
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0750"

- name: Configure electrum
  ansible.builtin.copy:
    src: electrum/config
    dest: /home/{{ username }}/.electrum/config
    mode: "0640"
    owner: "{{ username }}"
    group: "{{ username }}"
