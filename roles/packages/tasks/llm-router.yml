---
- name: Ensures ~/.config/rtk exists
  ansible.builtin.file:
    path: /home/{{ username }}/.config/rtk
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0750"

- name: Configure rtk
  ansible.builtin.copy:
    src: rtk/config.toml
    dest: /home/{{ username }}/.config/rtk/config.toml
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0440"

- name: Collect package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Create temp dir for rtk app
  ansible.builtin.tempfile:
    state: directory
  register: rtk_download_tempdir
  when: ('rtk' not in ansible_facts.packages) or ('rtk' in ansible_facts.packages and ansible_facts.packages.rtk[0].version != rtk_full_version)

- name: Get rtk
  ansible.builtin.get_url:
    url: https://github.com/rtk-ai/rtk/releases/download/v{{ rtk_version }}/rtk_amd64.deb
    dest: "{{ rtk_download_tempdir.path }}/rtk.deb"
    checksum: "{{ rtk_checksum }}"
    mode: "0444"
  when: ('rtk' not in ansible_facts.packages) or ('rtk' in ansible_facts.packages and ansible_facts.packages.rtk[0].version != rtk_full_version)

- name: Install rtk
  ansible.builtin.apt:
    deb: "{{ rtk_download_tempdir.path }}/rtk.deb"
  when: ('rtk' not in ansible_facts.packages) or ('rtk' in ansible_facts.packages and ansible_facts.packages.rtk[0].version != rtk_full_version)

- name: Remove tempdir
  ansible.builtin.file:
    path: "{{ rtk_download_tempdir.path }}"
    state: absent
  when: ('rtk' not in ansible_facts.packages) or ('rtk' in ansible_facts.packages and ansible_facts.packages.rtk[0].version != rtk_full_version)

- name: Create omniroute user
  ansible.builtin.user:
    name: omniroute
    shell: /bin/false
    create_home: true
    home: /var/lib/omniroute
    system: true
  register: omniroute_user

- name: Add subgid for omniroute user
  ansible.builtin.command:
    cmd: usermod -w 100000-165535 omniroute
  changed_when: false

- name: Add subuid for omniroute user
  ansible.builtin.command:
    cmd: usermod -v 100000-165535 omniroute
  changed_when: false

- name: Ensures /var/lib/omniroute/.config/containers/systemd exists
  ansible.builtin.file:
    path: /var/lib/omniroute/.config/containers/systemd
    state: directory
    owner: omniroute
    group: omniroute
    mode: "0755"

- name: Ensures volume dirs exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: omniroute
    group: omniroute
    mode: "0770"
  loop:
    - /var/lib/omniroute/export
    - /etc/qdrant
    - /var/cache/searxng
    - /etc/searxng
    - /var/lib/llamacpp/models

- name: Get nomic-embed-text-v1.5
  ansible.builtin.get_url:
    url: https://huggingface.co/mradermacher/nomic-embed-text-v1.5-GGUF/resolve/main/nomic-embed-text-v1.5.Q4_K_S.gguf
    dest: "/var/lib/llamacpp/models/nomic-embed-text-v1.5.Q4_K_S.gguf"
    checksum: "sha512:a5a61a2baca6bee4cb56fe1ee4bc0d29fb705ffdc79ce36d7dd6b91de67bfc44ecf81a92161c70876f9bbcb56c1505bc3d1f5b2c49fa9793fa21ddfbbd907092"
    mode: "0444"

- name: Copy searxng config
  ansible.builtin.template:
    src: searxng/settings.yml.j2
    dest: /etc/searxng/settings.yml
    mode: "0600"
    owner: omniroute
    group: omniroute

- name: Copy omniroute container config
  ansible.builtin.copy:
    src: "omniroute/{{ item }}"
    dest: "/var/lib/omniroute/.config/containers/systemd/{{ item }}"
    mode: "0600"
    owner: omniroute
    group: omniroute
  loop:
    - omniroute.container
    - omniroute.network
    - qdrant.container
    - searxng.container
    - llamacpp.container

- name: Enable linger for omniroute user
  ansible.builtin.command:
    cmd: loginctl enable-linger omniroute
    creates: /var/lib/systemd/linger/omniroute

- name: Enable containers
  become: true
  become_user: omniroute
  ansible.builtin.systemd:
    scope: user
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - omniroute
    - qdrant
    - searxng
    - llamacpp

- name: Enable podman-auto-update
  become: true
  become_user: omniroute
  ansible.builtin.systemd:
    scope: user
    name: podman-auto-update
    enabled: true
