---
- name: Install waydroid
  register: install_waydroid
  until: install_waydroid is succeeded
  ansible.builtin.apt:
    name:
      - waydroid
      - fdroidcl
    state: present

- name: Init waydroid
  ansible.builtin.command:
    cmd: waydroid init
    creates: "/var/lib/waydroid/images/system.img"
