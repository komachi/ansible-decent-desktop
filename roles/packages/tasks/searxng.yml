- name: Create searx user
  ansible.builtin.user:
    name: searx
    shell: /bin/false
    create_home: true
    home: /var/lib/searx
    system: true
  register: searxng_user

- name: Add subgid for searx user
  ansible.builtin.command:
    cmd: usermod -w 100000-165535 searx
  changed_when: false

- name: Add subuid for searx user
  ansible.builtin.command:
    cmd: usermod -v 100000-165535 searx
  changed_when: false

- name: Ensures /var/lib/searx/.config/containers/systemd exists
  ansible.builtin.file:
    path: /var/lib/searx/.config/containers/systemd
    state: directory
    owner: searx
    group: searx
    mode: "0755"

- name: Ensures volume dirs exists
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: searx
    group: searx
    mode: "0770"
  loop:
    - /var/cache/searxng
    - /etc/searxng

- name: Copy searxng config
  ansible.builtin.template:
    src: searxng/settings.yml.j2
    dest: /etc/searxng/settings.yml
    mode: "0600"
    owner: searx
    group: searx

- name: Copy searxng container config
  ansible.builtin.copy:
    src: searxng/searxng.container
    dest: /var/lib/searx/.config/containers/systemd/searxng.container
    mode: "0600"
    owner: searx
    group: searx
  register: searxng_container

- name: Enable linger for searx user
  ansible.builtin.command:
    cmd: loginctl enable-linger searx
    creates: /var/lib/systemd/linger/searx

- name: Enable searxng
  become: true
  become_user: searx
  ansible.builtin.systemd:
    scope: user
    name: searxng
    enabled: true
    state: started
