---
- name: Install valkey and ansible
  ansible.builtin.apt:
    name:
      - valkey-server
      - ansible
      - ansible-mitogen
      - python3-redis
    state: present

- name: Enable valkey-server service
  ansible.builtin.systemd:
    state: started
    name: valkey-server
    enabled: true

- name: Copy ansible.cfg
  ansible.builtin.copy:
    src: ansible/ansible.cfg
    dest: /home/{{ username }}/.ansible.cfg
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0440"
