---
- name: Create ananicy tempdir
  ansible.builtin.tempfile:
    state: directory
  register: ananicy_tempdir

- name: Clone ananicy repo
  ansible.builtin.git:
    repo: "{{ ananicy_repo }}"
    dest: "{{ ananicy_tempdir.path }}/src"
    depth: "1"
    clone: true
    version: "{{ ananicy_commit }}"

- name: Build ananicy deb
  ansible.builtin.shell:
    chdir: "{{ ananicy_tempdir.path }}/src"
    cmd: dpkg-buildpackage -b && mv ananicy-cpp_*.deb ../ananicy-cpp.deb
  changed_when: true

- name: Install ananicy
  ansible.builtin.apt:
    deb: "{{ ananicy_tempdir.path }}/ananicy.deb"

- name: Remove tempdir
  ansible.builtin.file:
    path: "{{ ananicy_tempdir.path }}"
    state: absent
