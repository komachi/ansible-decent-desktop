---
- name: Remove network-manager related packages
  register: remove_network_manager
  until: remove_network_manager is succeeded
  ansible.builtin.apt:
    name:
      - wpasupplicant
      - network-manager
    state: absent

- name: Install connman package
  register: install_connman
  until: install_connman is succeeded
  ansible.builtin.apt:
    name:
      - connman
      - connman-vpn
      - cmst
      - ofono
      - iwd
    state: present

- name: Ensures systemd connman overrides dir exists
  ansible.builtin.file:
    path: /etc/systemd/system/connman.service.d
    state: directory
    mode: "0755"

- name: Copy connman systemd unit override
  ansible.builtin.copy:
    src: systemd/connman-override.conf
    dest: /etc/systemd/system/connman.service.d/override.conf
    mode: "0640"

- name: Configure connman
  community.general.ini_file:
    path: /etc/connman/main.conf
    section: "{{ item[0] }}"
    option: "{{ item[1] }}"
    value: "{{ item[2] }}"
    mode: "0440"
  loop:
    - ["General", "PreferredTechnologies", "ethernet,wifi"]
    - ["General", "AllowHostnameUpdates", "false"]
    - ["General", "SingleConnectedTechnology", "true"]
    - ["General", "BackgroundScanning", "true"]
    - ["General", "AllowDomainnameUpdates", "false"]
    - ["General", "OnlineCheckMode", "none"]
    - [
        "General",
        "NetworkInterfaceBlacklist",
        "vmnet,vboxnet,virbr,ifb,ve-,vb-,veth",
      ]
