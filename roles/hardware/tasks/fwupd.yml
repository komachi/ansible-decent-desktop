---
- name: Install fwupd
  register: install_fwupd
  until: install_fwupd is succeeded
  ansible.builtin.apt:
    name:
      - fwupd
    state: present

- name: Configure fwupd
  community.general.ini_file:
    path: /etc/fwupd/fwupd.conf
    section: "{{ item[0] }}"
    option: "{{ item[1] }}"
    value: "{{ item[2] }}"
    mode: "0400"
  loop:
    - [fwupd, DisabledPlugins, "test;test_ble;msr"]
    - [fwupd, P2pPolicy, nothing]
